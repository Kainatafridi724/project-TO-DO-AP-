<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TO-DO list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="position: relative; width: 100%; height: 100vh;">
<img style="width: 100%; height: 700px; display: block; position: absolute; top: 0%;left: 0%;object-fit: cover;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgLG3tLv6ytcHp-79Xz62mRaSj1frLbiZnxzsmIE5HPA&s=10" alt="">
  
  <section class="box" style="background-color: rgb(253, 211, 218)
  ; width: 290px; margin:10px auto 0 auto ; ;height: 200px;justify-content: center; display: block ;position: relative; 
  text-align: center; z-index: 2; box-shadow: 0 4px 15px rgba(0,0,0,0,0.2);padding:10px ; border-radius: 5px;"  >

<h1><u>To-Do List</u></h1>
   <div>
     <input type="text" id="display" style="border-radius: 20px; width: 250px;border: 2px solid; height: 20px;" onkeydown="pressEnter(event)">
       </div>
       <div style="padding: 20px;">
     <button onclick="onClick()"
        style="background-color: rgb(158, 70, 241); border-radius: 20px; border: 1px white; width: 100px; height: 40px; font-size: larger; color: white;">add</button>

      <button onclick="onSubmit(this)"
        style="background-color: red; border-radius: 20px; border: 1px white; width: 100px; height: 40px; font-size: larger; color: white;">delete</button>
  </div>
    <ul class="list" style="list-style: none; padding: 0%; margin: 0%;"></ul>
  </section>
</div>
</body> 


<script src="app.js"></script>

</html>
